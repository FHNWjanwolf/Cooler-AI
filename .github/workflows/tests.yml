# Lässt pytest bei jedem Pull Request auf dev, test und main laufen.
# Ist der Lauf rot, sollte der Pull Request nicht gemergt werden.
name: Tests

on:
  pull_request:
    branches: [dev, test, main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: pytest
